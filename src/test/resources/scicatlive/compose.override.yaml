services:
  backend-configs:
    image: curlimages/curl:8.19.0
    user: root
    volumes:
      - backend-configs:/configs
    command:
      - sh
      - -c
      - |
        set -e
        curl -fsSL -o /configs/publishedDataConfig.json \
          https://raw.githubusercontent.com/paulscherrerinstitute/scicat-ci/refs/heads/main/helm/configs/backend-next/publishedDataConfig.json
        curl -fsSL -o /configs/ajvCustomDefinitions.js \
          https://raw.githubusercontent.com/paulscherrerinstitute/scicat-ci/refs/heads/main/helm/configs/backend-next/ajvCustomDefinitions.js
    restart: "no"
  keycloak:
    image: tianon/true
    scale: 0
  ldap:
    image: tianon/true
    scale: 0
  opensearch:
    image: tianon/true
    scale: 0
  backend:
    image: scicat-backend:psi_local
    build:
      context: https://github.com/SciCatProject/backend.git#feat/validate-oncreate
    pull_policy: build
    environment:
      - SITE=PSI
      - OPENSEARCH_ENABLED=false
      - OIDC_ISSUER=
      - AJV_CUSTOM_DEFINITIONS_FILE=/home/node/app/ajvCustomDefinitions.js
      - SCICAT_FRONTEND_URL=http://localhost
    configs:
      - source: functionalAccounts
        target: /home/node/app/functionalAccounts.json
    volumes:
      - type: volume
        source: backend-configs
        target: /home/node/app/publishedDataConfig.json
        read_only: true
        volume:
          subpath: publishedDataConfig.json
      - type: volume
        source: backend-configs
        target: /home/node/app/ajvCustomDefinitions.js
        read_only: true
        volume:
          subpath: ajvCustomDefinitions.js
    depends_on: !override
      mongodb:
        condition: service_started
      backend-configs:
        condition: service_completed_successfully
  s3-broker:
    image: ghcr.io/paulscherrerinstitute/scicat-s3-broker:0.5.1
    labels:
      - traefik.http.services.s3-broker.loadbalancer.server.port=8080
    configs:
      - source: s3-config
        target: /env/config
      - source: s3-credentials
        target: /env/credentials
    environment:
    - SCICAT_URL=http://backend:3000
    - JOB_MANAGER_USERNAME=admin
    - JOB_MANAGER_PASSWORD=2jf70TPNZsS
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure
  mongodb:
    configs:
      - source: mongodb_seed_publisheddata_json
        target: /seed/PublishedData.json
      - source: mongodb_seed_job_json
        target: /seed/Job.json

volumes:
  backend-configs:

configs:
  functionalAccounts:
    content: |
      [
        {
          "username": "admin",
          "password": "2jf70TPNZsS",
          "email": "scicatadmin@your.site",
          "role": "admin"
        },
        {
          "username": "rocrate",
          "email": "rocrate@your.site",
          "password": "rocrate",
          "role": ["rocrate", "group-1", "group-2", "group-3", "group1"],
          "global": false
        },
        {
          "username": "nogroup",
          "email": "nogroup@your.site",
          "password": "nogroup",
          "role": [],
          "global": false
        }
      ]
  s3-config:
    content: |
      [profile ceph]
      endpoint_url = https://rgw.cscs.ch
      region = us-east-1
  s3-credentials:
    content: |
      [ceph]
      aws_access_key_id=<your aws_access_key_id>
      aws_secret_access_key=<your aws_secret_access_key>
