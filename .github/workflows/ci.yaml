name: CI

on:
  pull_request:
    branches: '**'

permissions:
  packages: write

env:
  devImage: ghcr.io/${{ github.repository }}-devcontainer

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      rebuildDevContainer: ${{ steps.check_changes.outputs.devcontainer_any_changed }}
      lintWorkflows: ${{ steps.check_changes.outputs.workflow_any_changed }}
      runTests: ${{ steps.check_changes.outputs.src_any_changed }}
      runReleaseDryRun: ${{ steps.check_changes.outputs.release_any_changed }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for changes
        id: check_changes
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            devcontainer:
              - .devcontainer/**
            workflow:
              - .github/workflows/**
            src:
              - src/**
              - pom.xml
              - .github/workflows/ci.yaml
              - .mvn/**
              - mvnw{,.cmd}
              - .devcontainer/**
            release:
              - .releaserc.json
              - .github/semantic-release/**
              - .github/workflows/release.yaml
              - .github/workflows/ci.yaml
              - .devcontainer/**

  build:
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.rebuildDevContainer == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run Dev Container task
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.devImage }}
          cacheFrom: ${{ env.devImage }}
          push: always

  tests:
    name: Unit + Integration tests
    needs: check_changes
    if: needs.check_changes.outputs.runTests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run test suite
        uses: devcontainers/ci@v0.3
        with:
          push: never
          imageName: ${{ env.devImage }}
          cacheFrom: ${{ env.devImage }}
          runCmd: ./mvnw verify -DskipITs=false

  release_dry_run:
    name: semantic-release (dry run)
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.runReleaseDryRun == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Name the checked out merge commit after the base branch
        run: git checkout -B "$GITHUB_BASE_REF"

      - name: Dry run
        uses: devcontainers/ci@v0.3
        with:
          push: never
          imageName: ${{ env.devImage }}
          cacheFrom: ${{ env.devImage }}
          runCmd: |
            set -e
            npm install --prefix .github/semantic-release
            npx --prefix .github/semantic-release semantic-release --dry-run
          env: |
            CI=true
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GITHUB_ACTION=${{ github.action }}
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_REF=${{ github.ref }}
            GITHUB_SHA=${{ github.sha }}
            GITHUB_WORKFLOW=${{ github.workflow }}
            GITHUB_RUN_ID=${{ github.run_id }}
            GITHUB_RUN_NUMBER=${{ github.run_number }}

  actionlint:
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.lintWorkflows == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflow files
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  precommit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: pre-commit
        uses: devcontainers/ci@v0.3
        with:
          push: never
          imageName: ${{ env.devImage }}
          cacheFrom: ${{ env.devImage }}
          runCmd: pre-commit run --all-files
